apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: socialsync
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: socialsync
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: socialsync
        orgId: 1
        type: file
        options:
          path: /var/lib/grafana-dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
  namespace: socialsync
data:
  socialsync.json: |
    {
      "title": "SocialSync - Supervision",
      "uid": "socialsync-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {"id": 1, "type": "stat", "title": "Cibles actives (up)",
         "gridPos": {"x": 0, "y": 0, "w": 6, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(up)"}]},
        {"id": 2, "type": "stat", "title": "Jobs traités (total)",
         "gridPos": {"x": 6, "y": 0, "w": 6, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(socialsync_jobs_processed_total)"}]},
        {"id": 3, "type": "timeseries", "title": "Jobs traités par minute",
         "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "sum(increase(socialsync_jobs_processed_total[1m]))"}]},
        {"id": 4, "type": "timeseries", "title": "Mémoire du publisher",
         "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "process_resident_memory_bytes{job=\"socialsync-publisher\"}"}]},
        {"id": 5, "type": "timeseries", "title": "CPU du publisher",
         "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"refId": "A", "expr": "rate(process_cpu_seconds_total{job=\"socialsync-publisher\"}[1m])"}]}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: socialsync
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dash-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dash-json
              mountPath: /var/lib/grafana-dashboards
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dash-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dash-json
          configMap:
            name: grafana-dashboard-json
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: socialsync
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
